[package]
name = "atuin-bar"
version = "0.2.0"
description = "Spotlight-like overlay interface for atuin shell history search"
authors = []
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/tomatitito/atuin-bar"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[workspace]
# This package is its own workspace root

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "atuin_bar_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api"] }
tauri-plugin-opener = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ts-rs = { version = "10", features = ["serde-compat"] }
toml = "0.8"
dirs = "5"
atuin-client = { version = "18.16.1", default-features = false, features = ["daemon"] }
atuin-daemon = "18.16.1"
time = { version = "0.3", features = ["formatting", "local-offset"] }
tokio = { version = "1", features = ["rt-multi-thread"] }
uuid = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
semver = "1"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt"] }
tauri = { version = "2", features = ["macos-private-api", "test"] }
serial_test = "3"
proptest = "1"

[profile.release]
opt-level = "z"     # Optimize for size
lto = true          # Enable link-time optimization
codegen-units = 1   # Better optimization at cost of compile time
panic = "abort"     # Reduce binary size
strip = true        # Strip symbols from binary
