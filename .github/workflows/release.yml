name: Release

on:
  push:
    branches:
      - main
    tags:
      - 'v[0-9]*.[0-9]*.[0-9]*'
    paths:
      - package.json
      - pnpm-lock.yaml
      - src-tauri/Cargo.toml
      - src-tauri/Cargo.lock
      - src-tauri/tauri.conf.json
      - .github/workflows/release.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  prepare-release:
    name: Detect release version
    runs-on: ubuntu-latest
    outputs:
      should_release: ${{ steps.release.outputs.should_release }}
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect version and create tag
        id: release
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            tag="${GITHUB_REF_NAME}"
            version="${tag#v}"
            echo "should_release=true" >> "${GITHUB_OUTPUT}"
            echo "tag=${tag}" >> "${GITHUB_OUTPUT}"
            echo "version=${version}" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          version="$(node -p "require('./package.json').version")"
          tag="v${version}"

          node <<'NODE'
          const fs = require('node:fs');
          const pkg = require('./package.json').version;
          const tauri = require('./src-tauri/tauri.conf.json').version;
          const cargo = fs.readFileSync('src-tauri/Cargo.toml', 'utf8').match(/^version\s*=\s*"([^"]+)"/m)?.[1];
          if (!/^\d+\.\d+\.\d+$/.test(pkg)) {
            throw new Error(`package.json version must be x.y.z, got ${pkg}`);
          }
          if (tauri !== pkg || cargo !== pkg) {
            throw new Error(`Version mismatch: package.json=${pkg}, tauri.conf.json=${tauri}, Cargo.toml=${cargo}`);
          }
          NODE

          if git ls-remote --exit-code --tags origin "refs/tags/${tag}" >/dev/null 2>&1; then
            echo "Tag ${tag} already exists; no release needed."
            echo "should_release=false" >> "${GITHUB_OUTPUT}"
            echo "tag=${tag}" >> "${GITHUB_OUTPUT}"
            echo "version=${version}" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag "${tag}"
          git push origin "${tag}"

          echo "Created ${tag}; the tag push will run the release build."
          echo "should_release=false" >> "${GITHUB_OUTPUT}"
          echo "tag=${tag}" >> "${GITHUB_OUTPUT}"
          echo "version=${version}" >> "${GITHUB_OUTPUT}"

  build-macos:
    name: Build macOS app bundle
    runs-on: macos-latest
    needs: prepare-release
    if: needs.prepare-release.outputs.should_release == 'true'

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare-release.outputs.tag }}

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin,aarch64-apple-darwin

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Tauri app bundle
        run: pnpm tauri build --bundles app --target universal-apple-darwin --ci --no-sign

      - name: Package .app bundle as zip
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          shopt -s nullglob
          apps=(src-tauri/target/*/release/bundle/macos/*.app src-tauri/target/release/bundle/macos/*.app)
          if [[ ${#apps[@]} -eq 0 ]]; then
            echo "No .app bundle found under src-tauri/target" >&2
            exit 1
          fi
          ditto -c -k --sequesterRsrc --keepParent "${apps[0]}" "artifacts/atuin-bar-${{ needs.prepare-release.outputs.tag }}-macos-universal.zip"

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-app-bundle
          path: artifacts/*.zip
          if-no-files-found: error

  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs:
      - prepare-release
      - build-macos
    if: needs.prepare-release.outputs.should_release == 'true'

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.prepare-release.outputs.tag }}
          name: atuin-bar ${{ needs.prepare-release.outputs.tag }}
          generate_release_notes: true
          files: artifacts/*
